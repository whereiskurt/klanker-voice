<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KlankerMaker Voice — on hold</title>

    <!-- Keep these in step with client/index.html. The og:image MUST be a
         self-hosted same-origin PNG; third-party card hosts are rejected by
         some clients, which is why the real index.html self-hosts it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klanker Voice" />
    <meta property="og:title" content="Klanker Voice — resting" />
    <meta property="og:description" content="The KlankerMaker concierge is hibernating. It'll be back when there's something worth demoing." />
    <meta property="og:url" content="https://voice.klankermaker.ai/" />
    <meta property="og:image" content="https://voice.klankermaker.ai/og-image.png" />
    <meta property="og:image:secure_url" content="https://voice.klankermaker.ai/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klanker Voice — a public speech-to-speech voice agent" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klanker Voice — resting" />
    <meta name="twitter:description" content="The KlankerMaker concierge is hibernating. It'll be back when there's something worth demoing." />
    <meta name="twitter:image" content="https://voice.klankermaker.ai/og-image.png" />
    <meta name="twitter:image:alt" content="Klanker Voice — a public speech-to-speech voice agent" />

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh;
        display: grid; place-items: center;
        background: #0b0d10; color: #e6e8eb;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 30rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.75rem; letter-spacing: -0.01em; }
      p { margin: 0 0 0.5rem; color: #9aa3ad; }
      .dot {
        display: inline-block; width: 0.5rem; height: 0.5rem;
        border-radius: 50%; background: #f2b544; margin-right: 0.5rem;
        vertical-align: 0.05em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="dot"></span>On hold</h1>
      <p>The KlankerMaker voice concierge is hibernating to keep the lights cheap.</p>
      <p>It'll be back when there's something worth demoing.</p>
    </main>
  </body>
